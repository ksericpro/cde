worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    server {
        listen 5678 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/tayloruniversity.crt;
        ssl_certificate_key /etc/nginx/ssl/tayloruniversity.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        resolver 127.0.0.11 valid=10s;
        set $n8n_upstream n8n;

        location / {
            proxy_pass http://$n8n_upstream:5678;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable gzip compression from upstream so sub_filter can read/modify the HTML
            proxy_set_header Accept-Encoding "";

            # Hide X-Frame-Options to allow embedding in iMOPS / CDE web applications
            proxy_hide_header X-Frame-Options;

            # Allow cookies in cross-site iframe embedding
            proxy_cookie_path / "/; Secure; SameSite=None";

            # WebSocket and SSE support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Inject custom CSS stylesheet reference to replace n8n branding
            sub_filter '</head>' '<link rel="stylesheet" href="/custom-theme.css"></head>';
            sub_filter_once on;
        }

        # Serve the custom style stylesheet
        location = /custom-theme.css {
            root /usr/share/nginx/html;
            access_log off;
            default_type text/css;
        }

        # Serve the custom logo image
        location = /Workflow_engine_logo_loop_202607111220.png {
            root /usr/share/nginx/html;
            access_log off;
            default_type image/png;
        }

        # Intercept favicon/icon requests and serve the custom logo
        location ~* ^/(favicon\.(ico|svg|png)|favicon-(16x16|32x32)\.png|apple-touch-icon\.png|android-chrome-(192x192|512x512)\.png)$ {
            alias /usr/share/nginx/html/favicon_loop.png;
            access_log off;
            types {}
            default_type image/png;
        }
    }
}
