# =============================================================================
#  CDE Eclipse Mosquitto Configuration (MQTT + WebSockets + Dynamic Security)
# =============================================================================

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# -----------------------------------------------------------------------------
# Listeners
# -----------------------------------------------------------------------------
# Internal MQTT TCP listener (for CDE services like n8n, workers, and Cedalo UI)
listener 1883 0.0.0.0
protocol mqtt

# WebSockets listener (for Cloudflare Tunnel -> wss://mqtt.yourdomain.com)
listener 9001 0.0.0.0
protocol websockets

# -----------------------------------------------------------------------------
# Security: Dynamic Security Plugin (managed live via Cedalo Management Center)
# -----------------------------------------------------------------------------
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
