global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Host Infrastructure metrics (CPU, RAM, Disk, Network)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['cde-node-exporter:9100']
        labels:
          instance: 'cde-host'
          environment: 'production'

  # Scrape Docker container metrics via cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cde-cadvisor:8080']
        labels:
          instance: 'cde-docker'

  # Scrape Kong API Gateway (Traffic throughput, latencies, HTTP status codes)
  - job_name: 'kong-gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          service: 'kong-api-gateway'

  # Scrape n8n Workflow Automation Engine (Executions, Durations, Webhooks)
  - job_name: 'n8n'
    metrics_path: /metrics
    static_configs:
      - targets: ['n8n:5678']
        labels:
          service: 'n8n-workflow-engine'

  # Scrape iMOPS External Host Infrastructure (Node Exporter)
  - job_name: 'imops-infra'
    scrape_interval: 15s
    static_configs:
      - targets: ['10.99.32.54:9100', 'host.docker.internal:9100']
        labels:
          service: 'imops-host-infra'
          environment: 'production'

  # Scrape iMOPS Application API & Node.js Engine
  - job_name: 'imops-api'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['10.99.32.54:13000', 'host.docker.internal:13000']
        labels:
          service: 'imops-backend-api'
          environment: 'production'
