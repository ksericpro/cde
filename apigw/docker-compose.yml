services:
  kong-db:
    image: postgres:15-alpine
    container_name: kong-db
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kong-migrations:
    image: kong:3.9
    container_name: kong-migrations
    command: kong migrations bootstrap
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
    restart: on-failure

  kong:
    image: kong:3.9
    container_name: kong-gateway
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
      # Proxy ports
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      # Admin API & UI
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      # NOTE FOR MULTI-SERVER / REMOTE ACCESS (e.g. accessing webapp UI from vg):
      # If accessing Kong Manager from another machine, set KONG_ADMIN_GUI_API_URL to http://<WEBAPP_IP>:8001
      # so your browser queries the webapp host instead of local machine.
      KONG_ADMIN_GUI_URL: ${KONG_ADMIN_GUI_URL:-http://localhost:8002}
      KONG_ADMIN_GUI_API_URL: ${KONG_ADMIN_GUI_API_URL:-http://localhost:8001}
    ports:
      - "8088:8000"  # Public Proxy (HTTP)
      - "8443:8443"  # Public Proxy (HTTPS)
      - "8001:8001"  # Admin API
      - "8002:8002"  # Kong Manager UI
    restart: unless-stopped

volumes:
  pgdata: