input {
  # Kong Gateway TCP Log Stream (Structured JSON)
  tcp {
    port => 5000
    codec => json_lines
    type => "kong"
  }

  # Beats input from Filebeat (n8n container logs, docker logs)
  beats {
    port => 5044
  }
}

filter {
  if [type] == "kong" or [service] == "kong" or [request] {
    mutate {
      add_field => {
        "[@metadata][target_index]" => "cde-kong-logs"
        "log_source" => "kong-gateway"
      }
    }
  } else if [container][name] =~ "n8n" or [docker][container][name] =~ "n8n" or [fields][service] == "n8n" {
    mutate {
      add_field => {
        "[@metadata][target_index]" => "cde-n8n-logs"
        "log_source" => "n8n-workflow-engine"
      }
    }
  } else if [container][name] =~ "^kong-" or [docker][container][name] =~ "^kong-" {
    mutate {
      add_field => {
        "[@metadata][target_index]" => "cde-kong-logs"
        "log_source" => "kong-service"
      }
    }
  } else if [container][name] =~ "^cde-" or [docker][container][name] =~ "^cde-" {
    mutate {
      add_field => {
        "[@metadata][target_index]" => "cde-system-logs"
        "log_source" => "cde-system"
      }
    }
  } else {
    drop { }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}-%{+YYYY.MM.dd}"
  }
}
